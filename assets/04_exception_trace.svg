<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">异常控制：结构化失败先回到循环，终止条件独立判断</title>
  <desc id="desc">成功、拒绝、失败和部分成功有不同恢复策略；步骤和重试预算决定停止；每步更新状态、轨迹和检查点。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#fffaf5"/><stop offset="1" stop-color="#f8fbff"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#7c2d12" flood-opacity=".11"/></filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#64748b"/></marker>
    <style>text{font-family:Inter,"Noto Sans CJK SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:800;letter-spacing:1.5px;fill:#c2410c}.h{font-size:30px;font-weight:800}.sub{font-size:15px;fill:#64748b}.t{font-size:16px;font-weight:800}.b{font-size:12.5px;fill:#475569}.m{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#334155}.chip{font-size:11.5px;font-weight:800}.onDark{fill:#f8fafc}.onDarkMuted{fill:#cbd5e1}.onDarkBlue{fill:#bfdbfe}</style>
  </defs>
  <rect width="1400" height="820" fill="url(#bg)"/>
  <rect x="42" y="34" width="1316" height="752" rx="28" fill="#fff" stroke="#eadfd7" filter="url(#s)"/>
  <text x="82" y="80" class="k">CONTROL POINT 03 / EXCEPTION &amp; TRACE</text>
  <text x="82" y="119" class="h">“动作被拒绝”不等于“整次运行立即失败”</text>
  <text x="82" y="148" class="sub">执行器先返回结构化结果，Agent 可以换安全方案；预算、终止型策略或不可恢复异常才决定 run 停止。</text>
  <rect x="1052" y="68" width="266" height="68" rx="16" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1072" y="94" class="chip" fill="#c2410c">关键纠错</text><text x="1072" y="118" class="b">rejected 是工具结果，不是统一 stop_reason</text>

  <!-- status cards -->
  <rect x="80" y="198" width="1248" height="238" rx="22" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="104" y="231" class="t">ToolExecutionResult 的四类状态与恢复策略</text>

  <g filter="url(#s)"><rect x="104" y="254" width="266" height="150" rx="16" fill="#ecfdf5" stroke="#86efac"/></g>
  <rect x="122" y="270" width="52" height="24" rx="12" fill="#dcfce7"/><text x="148" y="287" text-anchor="middle" class="chip" fill="#15803d">ok</text>
  <text x="122" y="321" class="t">更新状态并继续</text>
  <text x="122" y="348" class="b"><tspan x="122">写 task_state + tool_executed</tspan><tspan x="122" dy="21">创建 checkpoint，进入下一轮</tspan></text>

  <g filter="url(#s)"><rect x="394" y="254" width="286" height="150" rx="16" fill="#eff6ff" stroke="#93c5fd"/></g>
  <rect x="412" y="270" width="74" height="24" rx="12" fill="#dbeafe"/><text x="449" y="287" text-anchor="middle" class="chip" fill="#1d4ed8">rejected</text>
  <text x="412" y="315" class="m"><tspan x="412">tool_not_allowed</tspan><tspan x="412" dy="20">invalid_arguments + path_escape</tspan><tspan x="412" dy="20">repeated_identical_call</tspan><tspan x="412" dy="20">approval_denied</tspan></text>
  <text x="412" y="393" class="b">通常返回循环；导师通知拒绝可设为终止型策略</text>

  <g filter="url(#s)"><rect x="704" y="254" width="266" height="150" rx="16" fill="#fff7ed" stroke="#fdba74"/></g>
  <rect x="722" y="270" width="56" height="24" rx="12" fill="#ffedd5"/><text x="750" y="287" text-anchor="middle" class="chip" fill="#c2410c">error</text>
  <text x="722" y="321" class="t">无变化的执行失败</text>
  <text x="722" y="348" class="m">tool_error_code = tool_failed</text>
  <text x="722" y="377" class="b">可换工具或结束；失败结果不能成为风险证据</text>

  <g filter="url(#s)"><rect x="994" y="254" width="310" height="150" rx="16" fill="#fef2f2" stroke="#fca5a5"/></g>
  <rect x="1012" y="270" width="112" height="24" rx="12" fill="#fee2e2"/><text x="1068" y="287" text-anchor="middle" class="chip" fill="#b91c1c">partial_success</text>
  <text x="1012" y="321" class="t">已经发生变化</text>
  <text x="1012" y="348" class="m">tool_partial_success</text>
  <text x="1012" y="376" class="b"><tspan x="1012">保存 affected_paths / diff_summary</tspan><tspan x="1012" dy="20">禁止自动重放，转人工补偿</tspan></text>

  <!-- budgets -->
  <rect x="80" y="462" width="450" height="154" rx="20" fill="#fff7ed" stroke="#fdba74"/>
  <text x="104" y="495" class="t">双预算防止空转</text>
  <text x="104" y="528" class="m"><tspan x="104">max_steps = 6</tspan><tspan x="104" dy="23">max_attempts = max(6×3, 6+4) = 18</tspan></text>
  <rect x="104" y="575" width="184" height="24" rx="12" fill="#ffedd5"/><text x="196" y="592" text-anchor="middle" class="chip" fill="#c2410c">step_limit_reached</text>
  <rect x="300" y="575" width="190" height="24" rx="12" fill="#ffedd5"/><text x="395" y="592" text-anchor="middle" class="chip" fill="#c2410c">retry_limit_reached</text>

  <rect x="554" y="462" width="774" height="154" rx="20" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="578" y="495" class="t">停止原因和状态分开保存</text>
  <text x="578" y="526" class="b">`status` 说明 completed / stopped / failed；`stop_reason` 说明为什么停。</text>
  <g>
    <rect x="578" y="548" width="170" height="25" rx="12" fill="#dcfce7"/><text x="663" y="566" text-anchor="middle" class="chip" fill="#15803d">final_answer_returned</text>
    <rect x="760" y="548" width="154" height="25" rx="12" fill="#ffedd5"/><text x="837" y="566" text-anchor="middle" class="chip" fill="#c2410c">tool_timeout</text>
    <rect x="926" y="548" width="164" height="25" rx="12" fill="#fee2e2"/><text x="1008" y="566" text-anchor="middle" class="chip" fill="#b91c1c">persistence_error</text>
    <rect x="1102" y="548" width="190" height="25" rx="12" fill="#fee2e2"/><text x="1197" y="566" text-anchor="middle" class="chip" fill="#b91c1c">resume_load_error</text>
    <text x="578" y="598" class="b">助教策略可把 notify_mentor 的审批拒绝映射为 approval_denied，但必须和普通参数拒绝区分。</text>
  </g>

  <!-- trace lane -->
  <rect x="80" y="642" width="1248" height="112" rx="20" fill="#0f172a"/>
  <text x="104" y="673" class="onDark" font-size="15" font-weight="800">核心 Trace（JSONL 逐条追加）</text>
  <text x="104" y="706" class="m onDarkBlue">run_started → prompt_built → model_requested → model_parsed → tool_executed → checkpoint_created → … → run_finished</text>
  <text x="104" y="734" class="b onDarkMuted">工具后：task_state + trace + checkpoint　｜　结束时：task_state + report　｜　状态与报告原子替换，Trace 只追加</text>
</svg>
